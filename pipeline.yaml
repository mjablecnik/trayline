  - loop:
      max_iterations: 5
      condition:
        file: "CODE_REVIEW.md"
        prompt: "Are there still some issues or action items in the code review that need fixing?"
      steps:
        - name: "code-review"
          agent: "kiro"
          prompt: |
            Read all files inside the .kiro/specs/{{specs-name}} folder.
            Analyze the entire codebase in {{path}} folder and perform a code review. 
            Compare the project against the specification and design documents. 
            Identify anything that was forgotten, implemented differently, or done incorrectly.
            Save your output to CODE_REVIEW.md with individual action items that need
            to be changed, improved, or fixed. If everything looks good, write that there are no remaining issues.

        - name: "apply-review-fixes"
          agent: "claude"
          prompt: |
            Read all files inside the .kiro/specs/{{specs-name}} folder.
            Also read the CODE_REVIEW.md file and implement all the changes and fixes described in it.
            After every major change and successful test, create a git commit with name Martin Jablečník <martin.jablecnik@email.cz>.
