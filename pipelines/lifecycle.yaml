before:
  - name: "sync-pull"
    agent: "claude"
    prompt: |
      Run `git pull origin main --rebase` in the current directory.

      If there are merge conflicts:
      1. Read the conflicting files and understand both sides
      2. For code files: preserve the intent of both changes, prefer the incoming (remote) version
         for .agents/ files since they are append-only logs
      3. For .agents/MEMORY.md and .agents/AI_LOG.md: keep ALL entries from both sides
      4. After resolving all conflicts, run `git rebase --continue`
      5. Verify the resolution is clean with `git status`

      If there are no conflicts, just confirm the pull succeeded.
      If the remote has no new commits, that's fine — just say "Already up to date."

after:
  - name: "update-ai-log"
    command: "trayline run tasks/update-ai-log --var pipeline-name={{pipeline-name}} --no-lifecycle"

  - name: "sync-push"
    agent: "claude"
    prompt: |
      Push all committed work to the bare repo:

      1. First run `git pull origin main --rebase` to catch any new commits pushed
         since the pipeline started.
      2. If there are merge conflicts:
         - For code files: preserve the intent of both changes
         - For .agents/MEMORY.md and .agents/AI_LOG.md: keep ALL entries from both sides
         - After resolving, run `git rebase --continue`
      3. Once clean, run `git push origin main`
      4. Confirm the push succeeded.

      If push still fails after pull+rebase, report the error.
