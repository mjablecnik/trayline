log-task: "tasks/update-ai-log"

retry:
  on-rate-limit: true
  wait-minutes: 30
  max-retries: 8

before:
  - name: "sync-pull"
    command: "git pull agent main --rebase"
  - name: "resolve-pull-conflicts"
    agent: "claude"
    model: "sonnet"
    prompt: |
      A git rebase failed due to merge conflicts. Check `git status` to see conflicted files.

      For each conflicted file:
      1. Read both versions (ours and theirs)
      2. For code files: preserve the intent of both changes, merge them intelligently
      3. For .agents/MEMORY.md and .agents/AI_LOG.md: keep ALL entries from both sides
      4. Mark each file as resolved with `git add <file>`
      5. After all conflicts are resolved, run `git rebase --continue`
      6. Verify with `git status` that the working tree is clean

      If `git status` shows no conflicts (rebase already completed), just say "No conflicts to resolve."

after:
  - name: "sync-push"
    command: "git push agent main"
  - name: "resolve-push-conflicts"
    agent: "claude"
    model: "sonnet"
    prompt: |
      A git push failed (likely non-fast-forward). Fix it:

      1. Run `git pull agent main --rebase`
      2. If there are merge conflicts, resolve them:
         - For code files: preserve the intent of both changes
         - For .agents/MEMORY.md and .agents/AI_LOG.md: keep ALL entries from both sides
         - After resolving, `git add` each file and `git rebase --continue`
      3. Once clean, run `git push agent main`
      4. Confirm the push succeeded.

      If `git status` shows everything is clean and push succeeds on first try, just confirm success.
