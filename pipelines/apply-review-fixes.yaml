variables:
  number: "5"
  specs-name: ""
  path: "orchestrator"

steps:
  - loop:
      max_iterations: 20
      condition:
        not_contains: "All tasks are done"
      steps:
        - name: "apply-review-fixes"
          agent: "claude"
          prompt: |
            Read all files inside the .kiro/specs/{{specs-name}} folder.
            Also read the CODE_REVIEW.md file from the project root directory (not inside {{path}}) and implement the changes and fixes described in it.
            Follow the tasks exactly and check off each task in CODE_REVIEW.md as you complete it.
            Implement only up to {{number}} tasks in this run, then stop.
            After every major change and successful test, create a git commit with name Martin Jablečník <martin.jablecnik@email.cz>.
            When you are done, print a summary of which tasks you completed. If all review tasks
            in CODE_REVIEW.md are now checked off, explicitly say "All tasks are done."
