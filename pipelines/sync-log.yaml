variables:
  path: "this"

steps:
  - name: "sync-ai-log"
    agent: "kiro"
    prompt: |
      Your job is to synchronize AI_LOG.md with the git history of the {{path}} project.

      STEP 1 — READ CURRENT STATE:
      - Read AI_LOG.md from {{path}}/.agents/ (if it exists).
      - Find the date/time of the most recent entry in AI_LOG.md.
        If AI_LOG.md doesn't exist, there is no previous state — all commits are new.

      STEP 2 — READ GIT LOG:
      - Run `git log` for the {{path}} directory to get all commits.
      - If AI_LOG.md had entries, only look at commits AFTER the most recent entry's date.
      - If AI_LOG.md didn't exist, read the entire git history.
      - Group commits by logical sessions (same day, related changes, similar commit messages).

      STEP 3 — GENERATE ENTRIES:
      For each group of commits not already covered by AI_LOG.md, create a new entry.

      If AI_LOG.md does not exist, create it with a "# AI Log" heading first.
      Ensure the {{path}}/.agents/ directory exists.

      Add NEW entries at the TOP of the log (below the # AI Log heading), in chronological order
      (most recent first), using this format:

      ## [date and time of the commit group] — manual
      - [summarize what was done based on commit messages and changed files]
      - [be specific: file names, features, fixes]
      - [group related commits into a single coherent entry]

      Rules:
      - Never modify or delete existing entries — only add new ones above them.
      - Use "manual" as the source label (these are changes made outside of pipelines).
      - Keep entries concise but specific.
      - Use past tense (Added, Fixed, Refactored, Updated, Removed).
      - If a commit message already clearly describes the change, use it as-is (rephrased if needed).
      - Don't create one entry per commit — group related commits into logical sessions.
      - Skip merge commits and "chore: update AI_LOG.md" commits (those are from pipelines).
      - If there are no new commits to log, say "AI_LOG.md is already up to date."

      After updating AI_LOG.md, create a git commit with name Martin Jablečník <martin.jablecnik@email.cz>
      and message "chore: sync AI_LOG.md with git history".
