variables:
  number: "5"
  specs-name: ""
  path: "orchestrator"

steps:
  - loop:
      max_iterations: 3
      condition:
        file: "CODE_REVIEW.md"
        prompt: "Are there still unchecked tasks in CODE_REVIEW.md (items marked with '- [ ]')? Answer true if there are unchecked items or if CODE_REVIEW.md does not exist yet, false if all are checked off or there are no remaining issues."
      steps:
        - name: "code-review"
          agent: "kiro"
          prompt: |
            Read all files inside the .kiro/specs/{{specs-name}} folder.
            Analyze the entire codebase in {{path}} folder and perform a code review. 
            Compare the project against the specification and design documents. 
            Identify anything that was forgotten, implemented differently, or done incorrectly.
            Save your output to CODE_REVIEW.md as a numbered task list with checkboxes using this format:
            - [ ] 1. Description of the first issue to fix
            - [ ] 2. Description of the second issue to fix
            Each task should be a single, actionable fix item that can be completed independently.
            If everything looks good, write that there are no remaining issues.

        - name: "apply-review-fixes"
          agent: "claude"
          prompt: |
            Read all files inside the .kiro/specs/{{specs-name}} folder.
            Also read the CODE_REVIEW.md file and implement the changes and fixes described in it.
            Follow the tasks exactly and check off each task as you complete it.
            Implement only up to {{number}} tasks in this run, then stop.
            After every major change and successful test, create a git commit with name Martin Jablečník <martin.jablecnik@email.cz>.
            When you are done, print a summary of which tasks you completed. If all review tasks
            in CODE_REVIEW.md are now checked off, explicitly say "All tasks are done."
