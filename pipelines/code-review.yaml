variables:
  number: "10"
  specs-name: ""
  path: "this"

steps:
  - loop:
      max_iterations: 3
      steps:
        - name: "code-review"
          agent: "kiro"
          prompt: |
            Read all files inside the .kiro/specs/{{specs-name}} folder.
            Analyze the entire codebase in {{path}} folder and perform a code review.
            Compare the project against the specification and design documents.
            Identify anything that was forgotten, implemented differently, or done incorrectly.

            MEMORY: If MEMORY.md exists inside {{path}}, read it for context on known issues
            and past solutions. If you find a recurring pattern or issue that future agents
            should know about, add it to MEMORY.md.
            Format: ## Short title\n- Problem: [what went wrong]\n- Solution: [how to fix it]\n- Source: code-review, [current date and time]

            Create two files in the project root directory (not inside {{path}}):

            1. CODE_REVIEW.md — A detailed analysis document. For each found issue include:
               - A clear description of the problem
               - Why it is a problem (impact, risk)
               - A suggested solution or approach to fix it
               - Severity label: [CRITICAL], [HIGH], [MEDIUM], or [LOW]
               Sort issues by severity (critical first).

            2. TASKS.md — A concise task list derived from CODE_REVIEW.md. Use this format:
               - [ ] 1. [CRITICAL] Short actionable description of what to fix
               - [ ] 2. [HIGH] Short actionable description of what to fix
               - [ ] 3. [MEDIUM] Short actionable description of what to fix
               - [ ] 4. [LOW] Short actionable description of what to fix
               Each task should be a single, actionable fix item that can be completed independently.
               Sort tasks by severity (critical first).

            If everything looks good, write that there are no remaining issues in both files.
          verbose: false
          condition:
            file: "TASKS.md"
            contains: "- [ ]"

        - name: "fix-critical-and-high-tasks"
          agent: "claude"
          prompt: |
            Read all files inside the .kiro/specs/{{specs-name}} folder.
            Also read CODE_REVIEW.md and TASKS.md from the project root directory (not inside {{path}}).
            Use CODE_REVIEW.md to understand the context, problem details, and suggested solutions.

            MEMORY: If MEMORY.md exists inside {{path}}, read it first for known issues and solutions.
            If you encounter and solve a non-obvious problem while fixing tasks, add it to MEMORY.md.
            Format: ## Short title\n- Problem: [what went wrong]\n- Solution: [how you fixed it]\n- Source: code-review-fix, [current date and time]

            Fix all tasks marked as [CRITICAL] and [HIGH] in TASKS.md.
            Follow the tasks exactly and check off each task in TASKS.md as you complete it.
            After every major change and successful test, create a git commit with name Martin Jablečník <martin.jablecnik@email.cz>.
            When you are done, print a summary of which tasks you completed.
          verbose: true

        - name: "fix-medium-tasks"
          agent: "claude"
          prompt: |
            Read all files inside the .kiro/specs/{{specs-name}} folder.
            Also read CODE_REVIEW.md and TASKS.md from the project root directory (not inside {{path}}).
            Use CODE_REVIEW.md to understand the context, problem details, and suggested solutions.

            MEMORY: If MEMORY.md exists inside {{path}}, read it first for known issues and solutions.
            If you encounter and solve a non-obvious problem while fixing tasks, add it to MEMORY.md.
            Format: ## Short title\n- Problem: [what went wrong]\n- Solution: [how you fixed it]\n- Source: code-review-fix, [current date and time]

            Fix all tasks marked as [MEDIUM] in TASKS.md.
            Follow the tasks exactly and check off each task in TASKS.md as you complete it.
            After every major change and successful test, create a git commit with name Martin Jablečník <martin.jablecnik@email.cz>.
            When you are done, print a summary of which tasks you completed. If all tasks
            in TASKS.md are now checked off, explicitly say "All tasks are done."
          verbose: true
