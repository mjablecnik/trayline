variables:
  number: "5"
  specs-name: ""
  path: "orchestrator"

steps:
  - loop:
      max_iterations: 3
      steps:
        - name: "code-review"
          agent: "kiro"
          prompt: |
            Read all files inside the .kiro/specs/{{specs-name}} folder.
            Analyze the entire codebase in {{path}} folder and perform a code review. 
            Compare the project against the specification and design documents. 
            Identify anything that was forgotten, implemented differently, or done incorrectly.
            Save your output to CODE_REVIEW.md in the project root directory (not inside {{path}}).
            Sort issues by importance and add a severity label to each one.
            Use this format for the task list with checkboxes:
            - [ ] 1. [CRITICAL] Description of the first issue to fix
            - [ ] 2. [HIGH] Description of the second issue to fix
            - [ ] 3. [MEDIUM] Description of the third issue to fix
            - [ ] 4. [LOW] Description of the fourth issue to fix
            Each task should be a single, actionable fix item that can be completed independently.
            If everything looks good, write that there are no remaining issues.
          verbose: false
          condition:
            file: "CODE_REVIEW.md"
            contains: "- [ ]"

        - name: "fix-critical-and-high-tasks"
          agent: "claude"
          prompt: |
            Read all files inside the .kiro/specs/{{specs-name}} folder.
            Also read the CODE_REVIEW.md file from the project root directory (not inside {{path}}).
            Fix all tasks marked as [CRITICAL] and [HIGH] in CODE_REVIEW.md.
            Follow the tasks exactly and check off each task in CODE_REVIEW.md as you complete it.
            After every major change and successful test, create a git commit with name Martin Jablečník <martin.jablecnik@email.cz>.
            When you are done, print a summary of which tasks you completed.
          verbose: true

        - name: "fix-medium-tasks"
          agent: "claude"
          prompt: |
            Read all files inside the .kiro/specs/{{specs-name}} folder.
            Also read the CODE_REVIEW.md file from the project root directory (not inside {{path}}).
            Fix all tasks marked as [MEDIUM] in CODE_REVIEW.md.
            Follow the tasks exactly and check off each task in CODE_REVIEW.md as you complete it.
            After every major change and successful test, create a git commit with name Martin Jablečník <martin.jablecnik@email.cz>.
            When you are done, print a summary of which tasks you completed. If all review tasks
            in CODE_REVIEW.md are now checked off, explicitly say "All tasks are done."
          verbose: true
