variables:
  number: "5"
  specs-name: ""
  path: "orchestrator"

steps:
  - loop:
      max_iterations: 3
      steps:
        - name: "code-review"
          agent: "kiro"
          prompt: |
            Read all files inside the .kiro/specs/{{specs-name}} folder.
            Analyze the entire codebase in {{path}} folder and perform a code review. 
            Compare the project against the specification and design documents. 
            Identify anything that was forgotten, implemented differently, or done incorrectly.
            Save your output to CODE_REVIEW.md in the project root directory (not inside {{path}}).
            Sort issues by importance and add a severity label to each one.
            Use this format for the task list with checkboxes:
            - [ ] 1. [CRITICAL] Description of the first issue to fix
            - [ ] 2. [HIGH] Description of the second issue to fix
            - [ ] 3. [MEDIUM] Description of the third issue to fix
            - [ ] 4. [LOW] Description of the fourth issue to fix
            Each task should be a single, actionable fix item that can be completed independently.
            If everything looks good, write that there are no remaining issues.
          verbose: false
          condition:
            file: "CODE_REVIEW.md"
            contains: "- [ ]"

        - name: "apply-review-fixes"
          command: "trayline run --pipeline apply-review-fixes --verbose --var specs-name={{specs-name}} --var path={{path}} --var number={{number}}"
          verbose: true
