variables:
  number: "10"
  specs-name: ""
  path: "this"

steps:
  - loop:
      max_iterations: 20
      condition:
        not_contains: "All tasks are done"
      steps:
        - name: "create-code"
          agent: "claude"
          prompt: |
            Read all files inside the .kiro/specs/{{specs-name}} folder and create the code according to the spec in {{path}} folder.
            Follow the tasks exactly and check off each task as you complete it.
            Implement only up to {{number}} tasks in this run, then stop.
            After every major change and successful test, create a git commit with name Martin Jablečník <martin.jablecnik@email.cz>.
            When you are done, print a summary of which tasks you completed. If all tasks
            in the spec are now checked off, explicitly say "All tasks are done."

  - name: "verify-builds"
    agent: "claude"
    prompt: |
      Test whether the build and docker build works for this project. If it doesn't work, fix the code so it builds successfully.

  - loop:
      max_iterations: 20
      condition:
        not_contains: "All tasks are done"
      steps:
        - name: "create-tests"
          agent: "claude"
          prompt: |
            Read all files inside the .kiro/specs/{{specs-name}} folder and create all optional tests that haven't been created yet.
            Follow the tasks exactly and check off each task as you complete it.
            Implement only up to {{number}} test tasks in this run, then stop.
            After every major change and successful test, create a git commit with name Martin Jablečník <martin.jablecnik@email.cz>.
            When you are done, print a summary of which tasks you completed. If all test tasks
            in the spec are now checked off, explicitly say "All tasks are done."

  - name: "code-review"
    command: "trayline run --pipeline code-review --verbose --var specs-name={{specs-name}} --var path={{path}} --var number={{number}}"
    verbose: true
