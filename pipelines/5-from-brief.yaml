variables:
  number: "10"
  brief: "BRIEF.md"
  path: "this"

steps:
  - name: "create-spec-from-brief"
    agent: "kiro"
    prompt: |
      Read the file {{brief}} in the project root directory.
      This file contains a short project brief — a high-level description of what needs to be built.

      Analyze the brief carefully and create two files in the project root directory (not inside {{path}}):

      1. SPEC.md — A concise but complete specification document:
         - Project overview and goals (derived from the brief)
         - Technical approach and architecture decisions
         - Key components and their responsibilities
         - File structure proposal (follow the project's existing conventions if any code exists)
         - Important constraints, edge cases, or considerations
         Keep it focused and actionable — no fluff, just what a developer needs to implement it.

      2. TASKS.md — A task list derived from SPEC.md. Use this format:
         - [ ] 1. [HIGH] Short actionable description of what to implement
         - [ ] 2. [HIGH] Short actionable description of what to implement
         - [ ] 3. [MEDIUM] Short actionable description of what to implement
         Order tasks so dependencies come first (setup, core logic, then features, then polish).
         Each task must be a single, independently completable unit of work.
         Be granular — one task per function, component, or logical unit.

  - loop:
      max_iterations: 50
      condition:
        not_contains: "All tasks are done"
      steps:
        - name: "implement-tasks"
          agent: "claude"
          prompt: |
            Read SPEC.md and TASKS.md from the project root directory (not inside {{path}}).

            MEMORY: If MEMORY.md exists inside {{path}}, read it first. It contains known problems
            and their solutions from previous runs. Follow its guidance to avoid repeating mistakes.

            Your job is to implement the tasks described in TASKS.md, following the specification in SPEC.md.
            Work in the {{path}} project directory.

            Rules:
            - Implement only up to {{number}} unchecked tasks in this run, then stop.
            - Follow the specification exactly.
            - Follow the project's existing code style, linting rules, and conventions.
            - Make sure the code compiles and tests pass after each change.
            - Check off each completed task in TASKS.md as you finish it.
            - After every major change and successful test, create a git commit with name Martin Jablečník <martin.jablecnik@email.cz>.

            If you encounter a non-obvious problem and solve it (dependency conflict, framework quirk,
            workaround needed, configuration issue), add it to MEMORY.md inside {{path}}.
            Format: ## Short title\n- Problem: [what went wrong]\n- Solution: [how you fixed it]\n- Source: from-brief, [current date and time]
            If MEMORY.md doesn't exist yet, create it with a "# Memory" heading.
            Only record genuinely useful insights — not trivial typos or obvious fixes.

            When you are done, print a summary of which tasks you completed.
            If all tasks in TASKS.md are now checked off, explicitly say "All tasks are done."

  - name: "update-ai-log"
    agent: "kiro"
    prompt: |
      Add a new entry to AI-LOG.md inside the {{path}} project directory.
      If AI-LOG.md does not exist, create it with a "# AI Log" heading first.

      Read TASKS.md and SPEC.md from the project root to understand what was done.
      Also check the git log for commits made during this pipeline run.

      Add a NEW entry at the TOP of the log (below the # AI Log heading), using this format:

      ## [current date and time] — from-brief
      - Brief: {{brief}}
      - [list features/components/services implemented]
      - [be specific: file names, function names, endpoints]

      Rules:
      - Never modify or delete existing entries — only prepend a new one.
      - Keep entries concise but specific.
      - Use past tense (Implemented, Created, Added, Configured).

      CLEANUP:
      After updating AI-LOG.md, delete the following temporary files from the project root
      (if they exist): TASKS.md, SPEC.md

      After cleanup, create a git commit with name Martin Jablečník <martin.jablecnik@email.cz>
      and message "chore: update AI-LOG.md".
