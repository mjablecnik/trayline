variables:
  specs-name: ""
  path: "this"
  number: "5"
  skip-improvements: "true"
  skip-security-audit: "false"
  skip-seo-audit: "false"

steps:
  - name: "code-review"
    command: "trayline run processes/8-code-review --var specs-name={{specs-name}} --var path={{path}} --var number={{number}} --no-lifecycle"
    verbose: true
    log: true

  - name: "improvements"
    command: "trayline run processes/9-improvements --var specs-name={{specs-name}} --var path={{path}} --var number={{number}} --no-lifecycle"
    verbose: true
    log: true
    skip: "{{skip-improvements}}"

  - name: "security-audit"
    command: "trayline run processes/10-security-audit --var path={{path}} --var number={{number}} --no-lifecycle"
    verbose: true
    log: true
    skip: "{{skip-security-audit}}"

  - name: "seo-audit"
    command: "trayline run processes/11-seo-audit --var path={{path}} --var number={{number}} --no-lifecycle"
    verbose: true
    log: true
    skip: "{{skip-seo-audit}}"
