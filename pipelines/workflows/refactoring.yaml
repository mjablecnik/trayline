variables:
  specs-name: ""
  path: "this"
  number: "5"
  skip-improvements: "true"

steps:
  - name: "code-review"
    command: "trayline run processes/8-code-review --var specs-name={{specs-name}} --var path={{path}} --var number={{number}} --no-lifecycle"

  - name: "improvements"
    command: "trayline run processes/9-improvements --var specs-name={{specs-name}} --var path={{path}} --var number={{number}} --no-lifecycle"
    skip: "{{skip-improvements}}"
