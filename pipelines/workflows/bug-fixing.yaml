variables:
  brief: "BRIEF.md"
  path: "this"
  number: "1"
  skip-create-tests: "true"
  skip-ui-tests: "true"

steps:
  - name: "create-from-brief"
    command: "trayline run processes/5-create-from-brief --var brief={{brief}} --var path={{path}} --var number={{number}} --no-lifecycle"
    verbose: true
    log: true

  - name: "create-tests"
    command: "trayline run processes/7-create-tests --var path={{path}} --var number={{number}} --no-lifecycle"
    verbose: true
    log: true
    skip: "{{skip-create-tests}}"

  - name: "ui-tests"
    command: "trayline run processes/6-ui-tests --var path={{path}} --var number={{number}} --no-lifecycle"
    verbose: true
    log: true
    skip: "{{skip-ui-tests}}"
