variables:
  specs-name: ""
  path: "this"
  number: "10"
  skip-code-review: "false"
  skip-create-tests: "false"
  skip-ui-tests: "false"

steps:
  - name: "create-code"
    command: "trayline run processes/4-create-code --var specs-name={{specs-name}} --var path={{path}} --var number={{number}} --no-lifecycle"

  - name: "code-review"
    command: "trayline run processes/8-code-review --var specs-name={{specs-name}} --var path={{path}} --var number={{number}} --no-lifecycle"
    skip: "{{skip-code-review}}"

  - name: "create-tests"
    command: "trayline run processes/7-create-tests --var specs-name={{specs-name}} --var path={{path}} --var number={{number}} --no-lifecycle"
    skip: "{{skip-create-tests}}"

  - name: "ui-tests"
    command: "trayline run processes/6-ui-tests --var path={{path}} --var number={{number}} --no-lifecycle"
    skip: "{{skip-ui-tests}}"
