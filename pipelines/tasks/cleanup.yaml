variables:
  push: "false"

steps:
  - name: "cleanup"
    command: |
      if [ "{{push}}" = "true" ]; then
        echo "PUSH_MODE"
      else
        git checkout -- . && git clean -fd && echo "Working tree cleaned."
      fi
    condition:
      contains: "PUSH_MODE"

  - name: "commit-and-push"
    agent: "claude"
    model: "sonnet"
    prompt: |
      Review the current git status, commit all changes, and push.

      Steps:
      1. Run `git status` and `git diff` to see what changed.
      2. If there are no changes (working tree clean), say "Nothing to commit." and stop.
      3. Stage all changes with `git add -A`.
      4. Generate a concise commit message based on the actual diff.
         Use conventional commit format (feat:, fix:, chore:, refactor:, docs:, etc.).
         Be specific about what changed — not generic messages like "update files".
      5. Create a commit with name Martin Jablečník <martin.jablecnik@email.cz>.
      6. Push to the current branch with `git push`.
         If push fails (non-fast-forward), pull with rebase first, then push again.
      7. Print the commit hash and message when done.
