variables:
  number: "10"
  specs-name: ""
  path: "this"

steps:
  - loop:
      max_iterations: 20
      condition:
        prompt: "Does the output contain the EXACT phrase 'All tasks are done'? Answer false if the phrase 'All tasks are done' appears in the output (meaning work is complete). Answer true if the phrase is NOT present (meaning there is still work to do)."
      steps:
        - name: "create-code"
          agent: "claude"
          prompt: |
            Read all files inside the .kiro/specs/{{specs-name}} folder and create the code according to the spec in {{path}} folder.
            Follow the tasks exactly and check off each task as you complete it.
            Implement only up to {{number}} tasks in this run, then stop.
            After every major change and successful test, create a git commit with name Martin Jablečník <martin.jablecnik@email.cz>.
            When you are done, print a summary of which tasks you completed. If all tasks
            in the spec are now checked off, explicitly say "All tasks are done."

  - name: "verify-builds"
    agent: "claude"
    prompt: |
      Test whether the build and docker build works for this project. If it doesn't work, fix the code so it builds successfully.

  - loop:
      max_iterations: 20
      condition:
        prompt: "Does the output contain the EXACT phrase 'All tasks are done'? Answer false if the phrase 'All tasks are done' appears in the output (meaning work is complete). Answer true if the phrase is NOT present (meaning there is still work to do)."
      steps:
        - name: "create-tests"
          agent: "claude"
          prompt: |
            Read all files inside the .kiro/specs/{{specs-name}} folder and create all optional tests that haven't been created yet.
            Follow the tasks exactly and check off each task as you complete it.
            Implement only up to {{number}} test tasks in this run, then stop.
            After every major change and successful test, create a git commit with name Martin Jablečník <martin.jablecnik@email.cz>.
            When you are done, print a summary of which tasks you completed. If all test tasks
            in the spec are now checked off, explicitly say "All tasks are done."

  - loop:
      max_iterations: 1
      steps:
        - name: "code-review"
          agent: "kiro"
          prompt: |
            Read all files inside the .kiro/specs/{{specs-name}} folder.
            Analyze the entire codebase in {{path}} folder and perform a code review. 
            Compare the project against the specification and design documents. 
            Identify anything that was forgotten, implemented differently, or done incorrectly.
            Save your output to CODE_REVIEW.md in the project root directory (not inside {{path}}).
            Sort issues by importance and add a severity label to each one.
            Use this format for the task list with checkboxes:
            - [ ] 1. [CRITICAL] Description of the first issue to fix
            - [ ] 2. [HIGH] Description of the second issue to fix
            - [ ] 3. [MEDIUM] Description of the third issue to fix
            - [ ] 4. [LOW] Description of the fourth issue to fix
            Each task should be a single, actionable fix item that can be completed independently.
            If everything looks good, write that there are no remaining issues.
          verbose: false
          condition:
            file: "CODE_REVIEW.md"
            prompt: "Does the output contain the EXACT phrase 'All tasks are done'? Answer false if the phrase 'All tasks are done' appears in the output (meaning work is complete). Answer true if the phrase is NOT present (meaning there is still work to do)."

        - name: "apply-review-fixes"
          agent: "claude"
          prompt: |
            Read all files inside the .kiro/specs/{{specs-name}} folder.
            Also read the CODE_REVIEW.md file from the project root directory (not inside {{path}}) and implement the changes and fixes described in it.
            Follow the tasks exactly and check off each task in CODE_REVIEW.md as you complete it.
            After every major change and successful test, create a git commit with name Martin Jablečník <martin.jablecnik@email.cz>.
            When you are done, print a summary of which tasks you completed. If all review tasks
            in CODE_REVIEW.md are now checked off, explicitly say "All tasks are done."
