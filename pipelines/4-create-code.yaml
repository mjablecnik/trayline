variables:
  number: "10"
  specs-name: ""
  path: "this"

steps:
  - loop:
      max_iterations: 50
      condition:
        not_contains: "All tasks are done"
      steps:
        - name: "create-code"
          agent: "claude"
          prompt: |
            Read all files inside the .kiro/specs/{{specs-name}} folder and create the code according to the spec in {{path}} folder.

            MEMORY: If MEMORY.md exists inside {{path}}/.agents/, read it first. It contains known problems
            and their solutions from previous runs. Follow its guidance to avoid repeating mistakes.

            Follow the tasks exactly and check off each task as you complete it.
            Implement only up to {{number}} tasks in this run, then stop.
            After every major change and successful test, create a git commit with name Martin Jablečník <martin.jablecnik@email.cz>.

            If you encounter a non-obvious problem and solve it (dependency conflict, framework quirk,
            workaround needed, configuration issue), add it to MEMORY.md inside {{path}}/.agents/.
            Format: ## Short title\n- Problem: [what went wrong]\n- Solution: [how you fixed it]\n- Source: create-code, [current date and time]
            If MEMORY.md doesn't exist yet, create it with a "# Memory" heading.
            Only record genuinely useful insights — not trivial typos or obvious fixes.

            When you are done, print a summary of which tasks you completed. If all tasks
            in the spec are now checked off, explicitly say "All tasks are done."

  - name: "verify-builds"
    agent: "claude"
    prompt: |
      Test whether the build and docker build works for this project. If it doesn't work, fix the code so it builds successfully.

      MEMORY: If MEMORY.md exists inside {{path}}/.agents/, read it first for known build issues and solutions.
      If you encounter and fix a new build problem, add it to MEMORY.md inside {{path}}/.agents/.
      Format: ## Short title\n- Problem: [what went wrong]\n- Solution: [how you fixed it]\n- Source: verify-builds, [current date and time]

  - loop:
      max_iterations: 50
      condition:
        not_contains: "All tasks are done"
      steps:
        - name: "create-tests"
          agent: "claude"
          prompt: |
            Read all files inside the .kiro/specs/{{specs-name}} folder and create all optional tests that haven't been created yet.

            MEMORY: If MEMORY.md exists inside {{path}}/.agents/, read it first for known issues and solutions.

            Rules:
            - Follow the tasks exactly and check off each task as you complete it.
            - Detect the existing test framework and conventions in the project
              (test runner, assertion style, file naming, folder structure).
            - Write tests that follow the same patterns as existing tests in the project.
            - After writing each test, run it and verify it passes. If it fails, fix it before moving on.
            - Mock all external dependencies (APIs, databases, file system, network).
              Tests must run independently without external services.
            - Each test must be deterministic — no random data, no time-dependent assertions.
            - Use descriptive test names that explain what is being tested and expected behavior.
            - Implement only up to {{number}} test tasks in this run, then stop.
            - After every major change and successful test, create a git commit with name Martin Jablečník <martin.jablecnik@email.cz>.

            If you encounter a non-obvious problem and solve it, add it to MEMORY.md inside {{path}}/.agents/.
            Format: ## Short title\n- Problem: [what went wrong]\n- Solution: [how you fixed it]\n- Source: create-tests, [current date and time]

            When you are done, print a summary of which tasks you completed. If all test tasks
            in the spec are now checked off, explicitly say "All tasks are done."

  - name: "code-review"
    command: "trayline run --pipeline code-review --verbose --var specs-name={{specs-name}} --var path={{path}} --var number={{number}}"
    verbose: true

  - name: "update-ai-log"
    agent: "kiro"
    prompt: |
      Add a new entry to AI_LOG.md inside {{path}}/.agents/.
      If AI_LOG.md does not exist, create it with a "# AI Log" heading first.
      Ensure the {{path}}/.agents/ directory exists.

      Read the spec files in .kiro/specs/{{specs-name}} and check the git log for commits
      made during this pipeline run to understand what was implemented.
      NOTE: Do NOT read TASKS.md from .agents/tmp/ — it was overwritten by the code-review step
      and no longer reflects the original implementation tasks. Rely on git log and spec files instead.

      Add a NEW entry at the TOP of the log (below the # AI Log heading), using this format:

      ## [current date and time] — create-code
      - Spec: {{specs-name}}
      - [list features/components/services implemented]
      - [list tests created]
      - [list code review fixes applied]
      - [be specific: file names, function names, endpoints]

      Rules:
      - Never modify or delete existing entries — only prepend a new one.
      - Keep entries concise but specific.
      - Use past tense (Implemented, Created, Added, Configured, Fixed).

      CLEANUP:
      After updating AI_LOG.md, delete the {{path}}/.agents/tmp/ directory entirely.

      After cleanup, create a git commit with name Martin Jablečník <martin.jablecnik@email.cz>
      and message "chore: update AI_LOG.md".
