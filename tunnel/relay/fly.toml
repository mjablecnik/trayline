app = "trayline-relay"
primary_region = "fra"

[build]

[env]
  WG_SERVER_IP = "10.0.0.1"
  WG_SUBNET = "24"
  WG_LISTEN_PORT = "51820"
  WG_HOME_AGENT_IP = "10.0.0.2"
  WG_PEER_ALLOWED_IPS = "10.0.0.2/32"
  UPSTREAM_PORT = "9000"

[[services]]
  protocol = "tcp"
  internal_port = 443

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[[services]]
  protocol = "udp"
  internal_port = 51820

  [[services.ports]]
    port = 51820

[checks]
  [checks.health]
    port = 8080
    type = "http"
    interval = "30s"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  count = 1
